[package]
name = "substrade-hub-e2e"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
codec = { package = "parity-scale-codec", version = "3", features = ["derive"] }

# Substrate
frame-support = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "master", default-features = false, features = ["std"] }
frame-system = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "master", default-features = false, features = ["std"] }
sp-core = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "master", default-features = false, features = ["std"] }
sp-crypto-hashing = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "master", default-features = false, features = ["std"] }
sp-runtime = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "master", default-features = false, features = ["std"] }
pallet-balances = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "master", default-features = false, features = ["std"] }
pallet-assets = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "master", default-features = false, features = ["std"] }
pallet-revive = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "master", default-features = false, features = ["std"] }

# Polkadot XCM
pallet-xcm = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "master", default-features = false, features = ["std"] }
xcm = { package = "staging-xcm", git = "https://github.com/paritytech/polkadot-sdk.git", branch = "master", default-features = false, features = ["std"] }
xcm-executor = { package = "staging-xcm-executor", git = "https://github.com/paritytech/polkadot-sdk.git", branch = "master", default-features = false, features = ["std"] }

# Cumulus / emulated test infra
emulated-integration-tests-common = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "master", default-features = true }
westend-system-emulated-network = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "master" }
parachains-common = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "master", default-features = true }
cumulus-pallet-xcmp-queue = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "master", default-features = false, features = ["std"] }

# ABI encoding for Solidity contract interaction
alloy-sol-types = "1"
alloy-primitives = "1"

# Forge artifact parsing
serde_json = "1"
hex = "0.4"

[dev-dependencies]
sp-tracing = { git = "https://github.com/paritytech/polkadot-sdk.git", branch = "master", default-features = true }
