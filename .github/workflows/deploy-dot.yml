name: Deploy .dot app

# Builds the trading UI for one network and publishes it to that network's Bulletin chain, pointing the
# network's dotNS name (apps/trade/src/config/networks.json `dotnsName`) at the new bundle and
# registering the name when it is free. Manual by default; a `dot-v*` tag publishes to previewnet.
# After a testnet reset, rerun it by hand to restore the name. See apps/trade/docs/deploy.md.
#
# Each network deploys from its own GitHub environment, `<network>-deploy`, which holds the secret
# DOTNS_MNEMONIC (the mnemonic of the account that owns, or will register, the name, funded on that
# network's Asset Hub) and the variable DOTNS_OWNER (that account's SS58 address). The publish refuses to
# run unless the mnemonic derives DOTNS_OWNER. On paseo-v2 the same secret also drives bootstrap.yml.

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Network to publish to (a key of apps/trade/src/config/networks.json)"
        type: choice
        options: [previewnet, paseo-v2]
        default: previewnet
      version:
        description: "App version MAJOR.MINOR.PATCH (published as appVersion)"
        required: true
  push:
    tags: ["dot-v*"]

# Shared with the bootstrap workflow: both sign with the same account, so they never run at once.
concurrency:
  group: chain-${{ github.event.inputs.network || 'previewnet' }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build & publish (${{ github.event.inputs.network || 'previewnet' }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Protected environment: gates DOTNS_MNEMONIC behind the branch rules set in repo settings.
    environment: ${{ github.event.inputs.network || 'previewnet' }}-deploy
    env:
      VITE_NETWORK: ${{ github.event.inputs.network || 'previewnet' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Descriptors are generated from committed metadata (gitignored output), same as the Frontend job.
      - name: Generate PAPI descriptors
        run: pnpm --filter @substrade-hub/trade exec papi generate

      # Version comes from the tag (dot-v1.2.3 -> 1.2.3) or the workflow_dispatch input. Validate here so
      # a malformed value fails before we publish.
      - name: Resolve app version
        id: ver
        # Never interpolate the untrusted input into the script body. Pass it via env, then validate
        # before use. GITHUB_EVENT_NAME / GITHUB_REF_NAME are trusted runner defaults.
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            V="${GITHUB_REF_NAME#dot-v}"
          else
            V="$INPUT_VERSION"
          fi
          if ! printf '%s' "$V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version '$V' is not MAJOR.MINOR.PATCH"; exit 1
          fi
          echo "app_version=$V" >> "$GITHUB_OUTPUT"

      - name: Build
        run: pnpm --filter @substrade-hub/trade build

      - name: Publish to Bulletin and point the dotNS name at it
        working-directory: apps/trade
        env:
          MNEMONIC: ${{ secrets.DOTNS_MNEMONIC }}
          DOTNS_OWNER: ${{ vars.DOTNS_OWNER }}
          APP_VERSION: ${{ steps.ver.outputs.app_version }}
        run: |
          if [ -z "$MNEMONIC" ]; then
            echo "::error::DOTNS_MNEMONIC secret is not set in the $VITE_NETWORK-deploy environment"; exit 1
          fi
          if [ -z "$DOTNS_OWNER" ]; then
            echo "::error::DOTNS_OWNER variable is not set in the $VITE_NETWORK-deploy environment"; exit 1
          fi
          node scripts/deploy-dot.mjs
