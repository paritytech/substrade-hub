name: Lint

on:
  push:
    branches: [main, master]
    paths:
      - "contracts/src/**"
      - "contracts/test/**"
      - "contracts/script/**"
      - "contracts/lib/**"
      - "contracts/foundry.toml"
      - "contracts/foundry.lock"
      - ".gitmodules"
      - ".github/workflows/lint.yml"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Starts on every pull request so the checks below, which the master ruleset requires, always
  # report: when a pull request touches nothing they cover, they are skipped, which counts as passing.
  changes:
    name: Contract changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PATTERN: '^(contracts/(src|test|script|lib)/|contracts/foundry\.(toml|lock)$|\.gitmodules$|\.github/workflows/lint\.yml$)'
        # Pushes to master are filtered by `paths` above, so they always run.
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ] || git diff --name-only "$BASE...$HEAD" | grep -qE "$PATTERN"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  fmt:
    name: Contracts formatting
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install foundry-polkadot
        env:
          FOUNDRY_DIR: ${{ github.workspace }}/.foundry
        # Pinned installer and release, so every run installs the same forge.
        run: |
          curl -sSf -L -o /usr/local/bin/foundryup \
            https://raw.githubusercontent.com/paritytech/foundry-polkadot/2375d9bef7479b5496e45959c95bdc38aab6f845/foundryup/foundryup
          chmod +x /usr/local/bin/foundryup
          mkdir -p "$FOUNDRY_DIR/bin" "$FOUNDRY_DIR/versions" "$FOUNDRY_DIR/share/man/man1"
          export PATH="$FOUNDRY_DIR/bin:$PATH"
          foundryup --install v1.5.1
          echo "$FOUNDRY_DIR/bin" >> $GITHUB_PATH

      - name: Check formatting
        run: forge fmt --check
        working-directory: contracts

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install foundry-polkadot
        env:
          FOUNDRY_DIR: ${{ github.workspace }}/.foundry
        # Pinned installer and release, so every run installs the same forge.
        run: |
          curl -sSf -L -o /usr/local/bin/foundryup \
            https://raw.githubusercontent.com/paritytech/foundry-polkadot/2375d9bef7479b5496e45959c95bdc38aab6f845/foundryup/foundryup
          chmod +x /usr/local/bin/foundryup
          mkdir -p "$FOUNDRY_DIR/bin" "$FOUNDRY_DIR/versions" "$FOUNDRY_DIR/share/man/man1"
          export PATH="$FOUNDRY_DIR/bin:$PATH"
          foundryup --install v1.5.1
          echo "$FOUNDRY_DIR/bin" >> $GITHUB_PATH

      # pallet-revive enforces the EIP-170 runtime limit (24,576 bytes) and the EIP-3860 initcode limit.
      # `--sizes` fails the build when a contract exceeds either. The margin check also fails when a
      # deployed contract gets within MIN_MARGIN bytes of a limit, so a PR sees the budget running out
      # before a deploy does; the job summary lists every margin.
      - name: Build and check contract sizes
        working-directory: contracts
        env:
          MIN_MARGIN: 512
          DEPLOYED: DLOB DLOBFactory Faucet RedBlackTree XcmBuilder
        run: |
          # forge exits 1 when a contract exceeds a limit but still writes the report; keep going so the
          # table and the annotation below name the contract and its (negative) margin.
          forge_status=0
          forge build --sizes --json > "$RUNNER_TEMP/sizes.json" || forge_status=$?
          [ -s "$RUNNER_TEMP/sizes.json" ] || exit "$forge_status"
          {
            echo "| Contract | Runtime | Margin | Initcode | Margin |"
            echo "|---|---|---|---|---|"
            for c in $DEPLOYED; do
              jq -r --arg c "$c" '.[$c] | "| \($c) | \(.runtime_size) | \(.runtime_margin) | \(.init_size) | \(.init_margin) |"' \
                "$RUNNER_TEMP/sizes.json"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          status=$forge_status
          for c in $DEPLOYED; do
            read -r runtime init < <(jq -r --arg c "$c" '.[$c] | "\(.runtime_margin // "missing") \(.init_margin // "missing")"' "$RUNNER_TEMP/sizes.json")
            if [ "$runtime" = missing ]; then
              echo "::error::$c is missing from forge's size report"; status=1; continue
            fi
            if [ "$runtime" -lt 0 ] || [ "$init" -lt 0 ]; then
              echo "::error::$c exceeds a size limit (runtime margin $runtime, initcode margin $init)"
              status=1
            elif [ "$runtime" -lt "$MIN_MARGIN" ] || [ "$init" -lt "$MIN_MARGIN" ]; then
              echo "::error::$c is within $MIN_MARGIN bytes of a size limit (runtime margin $runtime, initcode margin $init)"
              status=1
            fi
          done
          exit $status
