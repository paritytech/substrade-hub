name: Lint

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    name: Contracts formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install foundry-polkadot
        env:
          FOUNDRY_DIR: ${{ github.workspace }}/.foundry
        # Pinned installer and release, so every run installs the same forge.
        run: |
          curl -sSf -L -o /usr/local/bin/foundryup \
            https://raw.githubusercontent.com/paritytech/foundry-polkadot/2375d9bef7479b5496e45959c95bdc38aab6f845/foundryup/foundryup
          chmod +x /usr/local/bin/foundryup
          mkdir -p "$FOUNDRY_DIR/bin" "$FOUNDRY_DIR/versions" "$FOUNDRY_DIR/share/man/man1"
          export PATH="$FOUNDRY_DIR/bin:$PATH"
          foundryup --install v1.5.1
          echo "$FOUNDRY_DIR/bin" >> $GITHUB_PATH

      - name: Check formatting
        run: forge fmt --check
        working-directory: contracts

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install foundry-polkadot
        env:
          FOUNDRY_DIR: ${{ github.workspace }}/.foundry
        # Pinned installer and release, so every run installs the same forge.
        run: |
          curl -sSf -L -o /usr/local/bin/foundryup \
            https://raw.githubusercontent.com/paritytech/foundry-polkadot/2375d9bef7479b5496e45959c95bdc38aab6f845/foundryup/foundryup
          chmod +x /usr/local/bin/foundryup
          mkdir -p "$FOUNDRY_DIR/bin" "$FOUNDRY_DIR/versions" "$FOUNDRY_DIR/share/man/man1"
          export PATH="$FOUNDRY_DIR/bin:$PATH"
          foundryup --install v1.5.1
          echo "$FOUNDRY_DIR/bin" >> $GITHUB_PATH

      # pallet-revive enforces the EIP-170 runtime limit (24,576 bytes) and the EIP-3860 initcode limit.
      # `--sizes` fails the build when a contract exceeds either. The margin check also fails when a
      # deployed contract gets within MIN_MARGIN bytes of a limit, so a PR sees the budget running out
      # before a deploy does; the job summary lists every margin.
      - name: Build and check contract sizes
        working-directory: contracts
        env:
          MIN_MARGIN: 512
          DEPLOYED: DLOB DLOBFactory Faucet RedBlackTree XcmBuilder
        run: |
          forge build --sizes --json > "$RUNNER_TEMP/sizes.json"
          {
            echo "| Contract | Runtime | Margin | Initcode | Margin |"
            echo "|---|---|---|---|---|"
            for c in $DEPLOYED; do
              jq -r --arg c "$c" '.[$c] | "| \($c) | \(.runtime_size) | \(.runtime_margin) | \(.init_size) | \(.init_margin) |"' \
                "$RUNNER_TEMP/sizes.json"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          status=0
          for c in $DEPLOYED; do
            read -r runtime init < <(jq -r --arg c "$c" '.[$c] | "\(.runtime_margin // "missing") \(.init_margin // "missing")"' "$RUNNER_TEMP/sizes.json")
            if [ "$runtime" = missing ]; then
              echo "::error::$c is missing from forge's size report"; status=1; continue
            fi
            if [ "$runtime" -lt "$MIN_MARGIN" ] || [ "$init" -lt "$MIN_MARGIN" ]; then
              echo "::error::$c is within $MIN_MARGIN bytes of a size limit (runtime margin $runtime, initcode margin $init)"
              status=1
            fi
          done
          exit $status
