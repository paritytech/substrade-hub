name: Bootstrap network

# Runs contracts/scripts/bootstrap.mjs for one network: deploys the demo contracts and test assets,
# seeds the order books and writes the addresses into apps/trade/src/config/networks.json. Manual only.
# See apps/trade/docs/deploy.md.
#
# Every key comes from the secret DOTNS_MNEMONIC of the `<network>-deploy` environment, the same secret
# the .dot publish uses: its root account funds the run and owns the test assets and the dotNS name,
# and the EVM keys are its BIP-44 accounts. Fund that account (DOTNS_OWNER) before the first run.
#
# The run's progress, contracts/deployments/<network>.json, holds no secret. Every run keeps it as the
# artifact `bootstrap-state-<network>`, even when it fails, and the next run resumes from the newest one
# kept by a bootstrap run on master, the reviewed workflow. Only runs started after the last commit that
# changed the deployment record count, so a new deployment, whose PR deletes or replaces the record,
# starts fresh. The progress and the addresses in networks.json are also pushed to the branch
# `bootstrap/<network>`, for the PR that brings them to master; the bootstrap never reads that branch.

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Network to bootstrap (a key of apps/trade/src/config/networks.json)"
        type: choice
        options: [paseo-v2]
      step:
        description: "Run every step, or only one"
        type: choice
        options: [all, keys, fund, assets, factory, markets, faucet, seed, history, replenish, config]
        default: all
      fund:
        description: "Also send native funds to these SS58 accounts (space separated, optional)"
        required: false

# Shared with the .dot publish: both sign with the same account, so they never run at once.
concurrency:
  group: chain-${{ github.event.inputs.network }}
  cancel-in-progress: false

permissions:
  actions: read # find and download the progress kept by earlier runs
  contents: write

jobs:
  bootstrap:
    name: Bootstrap (${{ github.event.inputs.network }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ${{ github.event.inputs.network }}-deploy
    env:
      NETWORK: ${{ github.event.inputs.network }}
      BRANCH: bootstrap/${{ github.event.inputs.network }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          fetch-depth: 0 # the history of the deployment record decides which runs can be resumed

      - name: Resume from an earlier run on master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE="contracts/deployments/$NETWORK.json"
          SINCE=$(git log -1 --format=%ct -- "$FILE")
          echo "Deployment record last changed: ${SINCE:-never} (unix time)"
          RUNS=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow bootstrap.yml --branch master \
            --event workflow_dispatch --limit 100 --json databaseId,createdAt \
            --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID)
                   | select((.createdAt | fromdateiso8601) > ${SINCE:-0})]
                  | sort_by(.createdAt) | reverse | .[].databaseId")
          for RUN in $RUNS; do
            DIR=$(mktemp -d)
            if gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --name "bootstrap-state-$NETWORK" --dir "$DIR" 2>/dev/null; then
              mkdir -p "$(dirname "$FILE")" # gone from master once its last record is deleted
              cp "$DIR/$NETWORK.json" "$FILE"
              echo "Resuming from the progress of run $RUN"
              exit 0
            fi
          done
          echo "No earlier progress since the last deployment record; starting from the committed state"

      - name: Install foundry-polkadot
        env:
          FOUNDRY_DIR: ${{ github.workspace }}/.foundry
        # Pinned installer and release, so every run installs the same forge.
        run: |
          curl -sSf -L -o /usr/local/bin/foundryup \
            https://raw.githubusercontent.com/paritytech/foundry-polkadot/2375d9bef7479b5496e45959c95bdc38aab6f845/foundryup/foundryup
          chmod +x /usr/local/bin/foundryup
          mkdir -p "$FOUNDRY_DIR/bin" "$FOUNDRY_DIR/versions" "$FOUNDRY_DIR/share/man/man1"
          export PATH="$FOUNDRY_DIR/bin:$PATH"
          foundryup --install v1.5.1
          echo "$FOUNDRY_DIR/bin" >> $GITHUB_PATH

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap
        working-directory: contracts
        # Inputs reach the script through env and are validated, never interpolated into it.
        env:
          DEPLOY_MNEMONIC: ${{ secrets.DOTNS_MNEMONIC }}
          STEP: ${{ github.event.inputs.step }}
          FUND: ${{ github.event.inputs.fund }}
        run: |
          if [ -z "$DEPLOY_MNEMONIC" ]; then
            echo "::error::DOTNS_MNEMONIC secret is not set in the $NETWORK-deploy environment"; exit 1
          fi
          args=(--network "$NETWORK")
          if [ "$STEP" != "all" ]; then args+=(--only "$STEP"); fi
          for account in $FUND; do
            if ! printf '%s' "$account" | grep -qE '^[1-9A-HJ-NP-Za-km-z]{46,48}$'; then
              echo "::error::'$account' is not an SS58 address"; exit 1
            fi
            args+=(--fund "$account")
          done
          node scripts/bootstrap.mjs "${args[@]}"

      - name: Keep the progress for the next run
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bootstrap-state-${{ github.event.inputs.network }}
          path: contracts/deployments/${{ github.event.inputs.network }}.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Push the progress to the bootstrap branch
        if: always()
        run: |
          git add -- "contracts/deployments/$NETWORK.json" apps/trade/src/config/networks.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nothing to push"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Bootstrap $NETWORK (run $GITHUB_RUN_ID)"
          git push -f origin "HEAD:refs/heads/$BRANCH"
          {
            echo "Progress pushed to \`$BRANCH\`."
            echo "Once the run succeeds, open a PR: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/master...$BRANCH?expand=1"
          } >> "$GITHUB_STEP_SUMMARY"
