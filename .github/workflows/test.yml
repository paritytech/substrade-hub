name: Test

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit & Fuzz (pallet-revive)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Install foundry-polkadot
        env:
          FOUNDRY_DIR: ${{ github.workspace }}/.foundry
        # Pinned installer and release, so every run installs the same forge.
        run: |
          curl -sSf -L -o /usr/local/bin/foundryup \
            https://raw.githubusercontent.com/paritytech/foundry-polkadot/2375d9bef7479b5496e45959c95bdc38aab6f845/foundryup/foundryup
          chmod +x /usr/local/bin/foundryup
          mkdir -p "$FOUNDRY_DIR/bin" "$FOUNDRY_DIR/versions" "$FOUNDRY_DIR/share/man/man1"
          export PATH="$FOUNDRY_DIR/bin:$PATH"
          foundryup --install v1.5.1
          echo "$FOUNDRY_DIR/bin" >> $GITHUB_PATH

      - name: Run unit and fuzz tests
        run: forge test --polkadot --no-match-test "invariant_" -v
        working-directory: contracts

  invariant:
    name: Invariant (pallet-revive)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Install foundry-polkadot
        env:
          FOUNDRY_DIR: ${{ github.workspace }}/.foundry
        # Pinned installer and release, so every run installs the same forge.
        run: |
          curl -sSf -L -o /usr/local/bin/foundryup \
            https://raw.githubusercontent.com/paritytech/foundry-polkadot/2375d9bef7479b5496e45959c95bdc38aab6f845/foundryup/foundryup
          chmod +x /usr/local/bin/foundryup
          mkdir -p "$FOUNDRY_DIR/bin" "$FOUNDRY_DIR/versions" "$FOUNDRY_DIR/share/man/man1"
          export PATH="$FOUNDRY_DIR/bin:$PATH"
          foundryup --install v1.5.1
          echo "$FOUNDRY_DIR/bin" >> $GITHUB_PATH

      - name: Run invariant tests (lightweight)
        run: FOUNDRY_PROFILE=ci forge test --polkadot --match-test "invariant_" -v
        working-directory: contracts
