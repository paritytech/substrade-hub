name: Test

on:
  push:
    branches: [main, master]
    paths:
      - "contracts/src/**"
      - "contracts/test/**"
      - "contracts/script/**"
      - "contracts/lib/**"
      - "contracts/foundry.toml"
      - "contracts/foundry.lock"
      - ".gitmodules"
      - ".github/workflows/test.yml"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Starts on every pull request so the checks below, which the master ruleset requires, always
  # report: when a pull request touches nothing they cover, they are skipped, which counts as passing.
  changes:
    name: Contract changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PATTERN: '^(contracts/(src|test|script|lib)/|contracts/foundry\.(toml|lock)$|\.gitmodules$|\.github/workflows/test\.yml$)'
        # Pushes to master are filtered by `paths` above, so they always run.
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ] || git diff --name-only "$BASE...$HEAD" | grep -qE "$PATTERN"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  unit:
    name: Unit & Fuzz (pallet-revive)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install foundry-polkadot
        env:
          FOUNDRY_DIR: ${{ github.workspace }}/.foundry
        # Pinned installer and release, so every run installs the same forge.
        run: |
          curl -sSf -L -o /usr/local/bin/foundryup \
            https://raw.githubusercontent.com/paritytech/foundry-polkadot/2375d9bef7479b5496e45959c95bdc38aab6f845/foundryup/foundryup
          chmod +x /usr/local/bin/foundryup
          mkdir -p "$FOUNDRY_DIR/bin" "$FOUNDRY_DIR/versions" "$FOUNDRY_DIR/share/man/man1"
          export PATH="$FOUNDRY_DIR/bin:$PATH"
          foundryup --install v1.5.1
          echo "$FOUNDRY_DIR/bin" >> $GITHUB_PATH

      - name: Run unit and fuzz tests
        run: forge test --polkadot --no-match-test "invariant_" -v
        working-directory: contracts

  invariant:
    name: Invariant (pallet-revive)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install foundry-polkadot
        env:
          FOUNDRY_DIR: ${{ github.workspace }}/.foundry
        # Pinned installer and release, so every run installs the same forge.
        run: |
          curl -sSf -L -o /usr/local/bin/foundryup \
            https://raw.githubusercontent.com/paritytech/foundry-polkadot/2375d9bef7479b5496e45959c95bdc38aab6f845/foundryup/foundryup
          chmod +x /usr/local/bin/foundryup
          mkdir -p "$FOUNDRY_DIR/bin" "$FOUNDRY_DIR/versions" "$FOUNDRY_DIR/share/man/man1"
          export PATH="$FOUNDRY_DIR/bin:$PATH"
          foundryup --install v1.5.1
          echo "$FOUNDRY_DIR/bin" >> $GITHUB_PATH

      - name: Run invariant tests (lightweight)
        run: FOUNDRY_PROFILE=ci forge test --polkadot --match-test "invariant_" -v
        working-directory: contracts
