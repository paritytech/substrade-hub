name: Benchmark

# Measures the contracts' operations on a Chopsticks fork of paseo-v2 (contracts/scripts/bench/bench.mjs)
# and fails when one uses more than 95% of a transaction's limits. It warns when the results in
# contracts/docs/benchmarks.md are out of date. See that page.
on:
  pull_request:
    paths:
      - "contracts/src/**"
      - "contracts/scripts/bench/**"
      - ".github/workflows/bench.yml"
  schedule:
    # Weekly, to catch a runtime upgrade on paseo-v2 that changes what the contracts cost.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bench:
    name: Contract benchmarks (paseo-v2 fork)
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install foundry-polkadot
        env:
          FOUNDRY_DIR: ${{ github.workspace }}/.foundry
        # Pinned installer and release, so every run installs the same forge.
        run: |
          curl -sSf -L -o /usr/local/bin/foundryup \
            https://raw.githubusercontent.com/paritytech/foundry-polkadot/2375d9bef7479b5496e45959c95bdc38aab6f845/foundryup/foundryup
          chmod +x /usr/local/bin/foundryup
          mkdir -p "$FOUNDRY_DIR/bin" "$FOUNDRY_DIR/versions" "$FOUNDRY_DIR/share/man/man1"
          export PATH="$FOUNDRY_DIR/bin:$PATH"
          foundryup --install v1.5.1
          echo "$FOUNDRY_DIR/bin" >> $GITHUB_PATH

      - name: Build contracts
        run: forge build
        working-directory: contracts

      # Installs the pnpm version pinned by the root package.json `packageManager` field.
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The fork's cache of live state, so a run fetches less from the public RPC node.
      - name: Cache fork state
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: contracts/.chopsticks
          key: chopsticks-paseo-v2-${{ github.run_id }}
          restore-keys: chopsticks-paseo-v2-

      # The fork reads live state from the public RPC node, which drops connections at times: a run that
      # fails or hangs is retried once on a new fork. A call over the threshold (exit 2) is not retried.
      # The fork runs in its own process group (npx and the Chopsticks process under it), killed whole
      # after each attempt, so the retry starts on a free port and the cache is saved from a closed
      # database. Two attempts of 25 minutes fit the job's limit; a run takes about 11.
      - name: Benchmark
        working-directory: contracts
        run: |
          for attempt in 1 2; do
            setsid npx -y @acala-network/chopsticks@1.5.2 --config scripts/bench/paseo-v2.yml > "$RUNNER_TEMP/fork-$attempt.log" 2>&1 &
            fork=$!
            for _ in $(seq 1 100); do grep -q listening "$RUNNER_TEMP/fork-$attempt.log" && break; sleep 3; done
            status=0
            timeout 25m node scripts/bench/bench.mjs --levels 64 --check 95 --drift 5 --summary "$GITHUB_STEP_SUMMARY" || status=$?
            kill -- -"$fork" 2>/dev/null || true
            wait "$fork" 2>/dev/null || true
            if [ "$status" -eq 0 ] || [ "$status" -eq 2 ]; then exit "$status"; fi
            echo "::warning::Benchmark attempt $attempt failed (exit $status)"
            tail -n 40 "$RUNNER_TEMP/fork-$attempt.log"
          done
          exit 1
