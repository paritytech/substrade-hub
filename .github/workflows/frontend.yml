name: Frontend

on:
  push:
    branches: [main, master]
    paths:
      - "apps/**"
      - "patches/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/frontend.yml"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Starts on every pull request so the checks below, which the master ruleset requires, always
  # report: when a pull request touches nothing they cover, they are skipped, which counts as passing.
  changes:
    name: App changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PATTERN: '^(apps/|patches/|package\.json$|pnpm-(lock|workspace)\.yaml$|turbo\.json$|\.github/workflows/frontend\.yml$)'
        # Pushes to master are filtered by `paths` above, so they always run.
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ] || git diff --name-only "$BASE...$HEAD" | grep -qE "$PATTERN"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: Lint, typecheck, test & build
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the pnpm version pinned by the root package.json `packageManager` field.
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `@polkadot-api/descriptors` (file:.papi/descriptors) is generated from the committed metadata
      # (.papi/metadata/*.scale) and its output is gitignored, so it must be generated in CI before
      # typecheck/build. Offline — uses the committed metadata, no chain connection.
      - name: Generate PAPI descriptors
        run: pnpm --filter @substrade-hub/trade exec papi generate

      - name: Lint
        run: pnpm --filter @substrade-hub/trade lint

      - name: Typecheck
        run: pnpm --filter @substrade-hub/trade typecheck

      - name: Unit tests
        run: pnpm --filter @substrade-hub/trade test

      - name: Build
        run: pnpm --filter @substrade-hub/trade build
        env:
          VITE_NETWORK: previewnet
