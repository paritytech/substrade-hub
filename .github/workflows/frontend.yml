name: Frontend

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Installs the pnpm version pinned by the root package.json `packageManager` field.
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `@polkadot-api/descriptors` (file:.papi/descriptors) is generated from the committed metadata
      # (.papi/metadata/*.scale) and its output is gitignored, so it must be generated in CI before
      # typecheck/build. Offline — uses the committed metadata, no chain connection.
      - name: Generate PAPI descriptors
        run: pnpm --filter @substrade-hub/trade exec papi generate

      - name: Lint
        run: pnpm --filter @substrade-hub/trade lint

      - name: Typecheck
        run: pnpm --filter @substrade-hub/trade typecheck

      - name: Unit tests
        run: pnpm --filter @substrade-hub/trade test

      - name: Build
        run: pnpm --filter @substrade-hub/trade build
        env:
          VITE_NETWORK: previewnet
