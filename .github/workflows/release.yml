name: Release

# Publishes a release of the trading UI to every network in apps/trade/src/config/networks.json when a
# `dot-vX.Y.Z` tag is pushed on a commit of master, then creates the GitHub Release: a header read
# from the chain (each network's published CID and contracts, see apps/trade/scripts/release/) above
# notes generated from the merged PRs, with release-manifest.json, deployments.json, codehashes.json
# and abis.json attached. The "Protect dot-v release tags" ruleset limits who can push such a tag.
# Each network publishes through deploy-dot.yml from its own `<network>-deploy` environment, whose
# deployment rules must allow `dot-v*` tags. See apps/trade/docs/deploy.md.

on:
  push:
    tags: ["dot-v*"]

permissions:
  contents: read

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      networks: ${{ steps.check.outputs.networks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # GITHUB_REF_NAME and GITHUB_SHA are trusted runner defaults; the tag name is validated before use.
      - name: Check the version, and that the tag is on master
        id: check
        run: |
          V="${GITHUB_REF_NAME#dot-v}"
          if ! printf '%s' "$V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag $GITHUB_REF_NAME is not dot-vMAJOR.MINOR.PATCH"; exit 1
          fi
          git fetch -q origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on master"; exit 1
          fi
          PREV=$(git tag --list 'dot-v*' --sort=-v:refname | grep -vxF "$GITHUB_REF_NAME" | head -1 || true)
          if [ -n "$PREV" ] && [ "$(printf '%s\n%s\n' "${PREV#dot-v}" "$V" | sort -V | tail -1)" != "$V" ]; then
            echo "::error::$V is not newer than the previous release $PREV"; exit 1
          fi
          NETWORKS=apps/trade/src/config/networks.json
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "networks=$(jq -c 'keys' "$NETWORKS")" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish
    needs: check
    strategy:
      # Every network publishes even when another fails; rerun the failed ones before the release.
      fail-fast: false
      matrix:
        network: ${{ fromJSON(needs.check.outputs.networks) }}
    uses: ./.github/workflows/deploy-dot.yml
    with:
      network: ${{ matrix.network }}
      version: ${{ needs.check.outputs.version }}
    secrets: inherit

  # Builds the header and the assets with a read-only token: the build and the install run third-party
  # code (forge, viem and its dependencies), which must never share a runner with the write token.
  notes:
    name: Build the notes and assets
    needs: [check, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive # the contracts' libraries, for the build whose codehashes the release records

      # Same pinned archive as bootstrap.yml: bump V and SHA256 there and here together.
      - name: Install foundry-polkadot
        env:
          V: v1.5.1
          SHA256: c01fd8bcab0177232791b776098c7e55d97824c712095299351dd69c51c32f02
        run: |
          DIR="$RUNNER_TEMP/foundry"
          mkdir -p "$DIR/bin"
          curl -sSfL -o "$DIR/foundry.tar.gz" \
            "https://github.com/paritytech/foundry-polkadot/releases/download/$V/foundry_${V}_linux_amd64.tar.gz"
          echo "$SHA256  $DIR/foundry.tar.gz" | sha256sum -c -
          tar -xzf "$DIR/foundry.tar.gz" -C "$DIR/bin" forge
          echo "$DIR/bin" >> "$GITHUB_PATH"

      - name: Build the contracts
        run: forge build --quiet
        working-directory: contracts

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @substrade-hub/trade

      # Reads each network's dotNS contenthash, contracts and their code back from the chain. The
      # previous release's deployments.json gives the "contracts changed" line, and its abis.json the
      # "ABI changes" section; a release made before those assets existed falls back to its
      # networks.json and its generated ABI files.
      - name: Build the notes and assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV=$(git tag --list 'dot-v*' --sort=-v:refname | grep -vxF "$GITHUB_REF_NAME" | head -1 || true)
          ARGS=(--tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" --out release --contracts contracts)
          if [ -n "$PREV" ]; then
            ARGS+=(--previous-tag "$PREV")
            mkdir -p previous
            if gh release download "$PREV" --repo "$GITHUB_REPOSITORY" -D previous -p deployments.json 2>/dev/null; then
              ARGS+=(--previous-deployments previous/deployments.json)
            else
              git show "$PREV:apps/trade/src/config/networks.json" > previous/networks.json
              ARGS+=(--previous-networks previous/networks.json)
            fi
            if gh release download "$PREV" --repo "$GITHUB_REPOSITORY" -D previous -p abis.json 2>/dev/null; then
              ARGS+=(--previous-abis previous/abis.json)
            else
              mkdir -p previous/abi
              for f in dlob.ts dlob-factory.ts; do
                git show "$PREV:apps/trade/src/abi/$f" > "previous/abi/$f"
              done
              ARGS+=(--previous-abi-dir previous/abi)
            fi
          fi
          node apps/trade/scripts/release/notes.mjs "${ARGS[@]}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release
          if-no-files-found: error
          retention-days: 7

  # The only job with the write token. It runs no third-party code: no checkout, no install, only
  # GitHub's own actions and CLI on the files the notes job built.
  release:
    name: Create the GitHub Release
    needs: [check, notes]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "SubsTrade Hub $VERSION" --generate-notes --notes-file release/notes.md \
            release/release-manifest.json release/deployments.json release/codehashes.json release/abis.json
