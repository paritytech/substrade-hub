[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "prague"
via_ir = true

optimizer = true
optimizer_runs = 200

remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

[profile.default.fmt]
line_length = 100
tab_width = 4
bracket_spacing = false

[fuzz]
runs = 256
max_test_rejects = 65536

[invariant]
runs = 256
depth = 500

[profile.ci.invariant]
runs = 16
depth = 256

[rpc_endpoints]
anvil_polkadot = "http://localhost:8545"
asset_hub_westend = "https://services.polkadothub-rpc.com/testnet"

[etherscan]
polkadot-testnet = { key = "", url = "https://blockscout-testnet.polkadot.io/api?" }
polkadot = { key = "", url = "https://blockscout.polkadot.io/api?" }
